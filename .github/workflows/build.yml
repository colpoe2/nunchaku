name: Build Nunchaku on Windows (CUDA 12.6, Python 3.12, Torch 2.7)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-windows-cuda:
    name: Build Nunchaku (Windows + CUDA 12.6)
    runs-on: windows-latest
    env:
      NUNCHAKU_INSTALL_MODE: ALL
      NUNCHAKU_BUILD_WHEELS: 1
      CUDA_VERSION_MAJOR_MINOR: "12.6"
      PYTHON_VERSION: "3.12"
      TORCH_VERSION: "2.7.0" 
      TORCH_CUDA_SUFFIX: "cu126" 
      TORCHVISION_VERSION: "0.22.0" 
      TORCHAUDIO_VERSION: "2.7.0" 

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Visual Studio Build Tools
        shell: cmd
        run: |
          echo "Starting Visual Studio Build Tools installation..."
          choco install --no-progress visualstudio2022buildtools -y --package-parameters="'--add Microsoft.VisualStudio.Workload.NativeDesktop --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --add Microsoft.VisualStudio.Component.Windows10SDK.19041 --includeRecommended --norestart --quiet'"
          set CHOC_EXIT_CODE=%ERRORLEVEL%
          echo "Chocolatey install command finished with exit code: %CHOC_EXIT_CODE%"
          if %CHOC_EXIT_CODE% == 3010 (
            echo "Installation successful, reboot pending (exit code 3010). Treating as success for CI."
            exit /b 0
          ) else if %CHOC_EXIT_CODE% NEQ 0 (
            echo "Chocolatey installation failed with a critical error. Exit code: %CHOC_EXIT_CODE%"
            exit /b %CHOC_EXIT_CODE%
          )
          echo "Visual Studio Build Tools installation successful."

      - name: Display Windows Version
        shell: powershell
        run: |
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsArchitecture, OsHardwareAbstractionLayer
          (Get-WmiObject Win32_OperatingSystem).OSArchitecture
          (Get-WmiObject Win32_Processor).Architecture
          (Get-WmiObject Win32_Processor).AddressWidth # Should be 64 for 64-bit

      - name: Install CUDA Toolkit ${{ env.CUDA_VERSION_MAJOR_MINOR }} (using Network Installer)
        shell: cmd
        run: |
          set CUDA_INSTALLER_FILENAME=cuda_network_installer.exe
          REM 使用 NVIDIA CUDA Toolkit 12.6.0 网络安装程序 (通常用于 Windows 10/11/Server x64)
          REM 官方 CUDA 12.6.0 网络安装程序链接: https://developer.download.nvidia.com/compute/cuda/12.6.0/network_installers/cuda_12.6.0_win10_win11_network.exe
          set CUDA_DOWNLOAD_URL=https://developer.download.nvidia.com/compute/cuda/12.6.0/network_installers/cuda_12.6.0_windows_network.exe
          
          echo "Downloading CUDA Toolkit Network Installer from %CUDA_DOWNLOAD_URL% ..."
          curl -L -o %CUDA_INSTALLER_FILENAME% "%CUDA_DOWNLOAD_URL%" --retry 3 --retry-delay 5 --fail
          if %ERRORLEVEL% NEQ 0 (
            echo "Failed to download CUDA network installer. Curl exit code: %ERRORLEVEL%"
            exit /b %ERRORLEVEL%
          )
          
          echo "Verifying downloaded file exists and has size > 0..."
          for %%F in (%CUDA_INSTALLER_FILENAME%) do (
            if %%~zF EQU 0 (
              echo "ERROR: Downloaded CUDA installer is 0 bytes."
              exit /b 1
            )
            echo "Downloaded %CUDA_INSTALLER_FILENAME% size: %%~zF bytes"
          )

          echo "Installing CUDA Toolkit silently using Network Installer..."
          REM -s 用于静默安装。网络安装程序将在安装过程中下载组件。
          REM -noreboot 尝试禁止重启。
          REM -clean 尝试执行更干净的安装。
          %CUDA_INSTALLER_FILENAME% -s -noreboot -clean
          set CUDA_INSTALL_EXIT_CODE=%ERRORLEVEL%
          echo "CUDA Toolkit Network installation finished with exit code: %CUDA_INSTALL_EXIT_CODE%"
          
          if %CUDA_INSTALL_EXIT_CODE% NEQ 0 (
            if %CUDA_INSTALL_EXIT_CODE% == 3010 (
              echo "CUDA Toolkit installation successful (via network), reboot pending (exit code 3010). Treating as success for CI."
            ) else (
              echo "CUDA Toolkit Network installation failed with exit code: %CUDA_INSTALL_EXIT_CODE%."
              echo "Searching for NVIDIA install logs in %TEMP% and %ProgramData%..."
              dir "%TEMP%\NVIDIA*.log" /s /b
              dir "%TEMP%\NvidiaLogging" /s /b
              dir "%ProgramFiles%\NVIDIA Corporation\Installer2\*.log" /s /b
              dir "%ProgramData%\NVIDIA Corporation\Installer2\*.log" /s /b
              dir "C:\Windows\INF\setupapi.dev.log" /b
              exit /b %CUDA_INSTALL_EXIT_CODE% 
            )
          )
          
          echo "Setting CUDA environment variables..."
          set CUDA_PATH_VALUE=C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v${{ env.CUDA_VERSION_MAJOR_MINOR }}
          echo %CUDA_PATH_VALUE%\bin>>%GITHUB_PATH%
          echo %CUDA_PATH_VALUE%\libnvvp>>%GITHUB_PATH%
          echo CUDA_PATH=%CUDA_PATH_VALUE%>>%GITHUB_ENV%
          echo CUDA_HOME=%CUDA_PATH_VALUE%>>%GITHUB_ENV%

          echo "Verifying nvcc installation (using full path initially)..."
          REM 等待几秒钟，以防文件系统操作有延迟
          timeout /t 5 
          if not exist "%CUDA_PATH_VALUE%\bin\nvcc.exe" (
            echo "nvcc.exe not found at expected location: %CUDA_PATH_VALUE%\bin\nvcc.exe"
            echo "Listing contents of %CUDA_PATH_VALUE%\bin ..."
            dir "%CUDA_PATH_VALUE%\bin"
            echo "Listing contents of %CUDA_PATH_VALUE% ..."
            dir "%CUDA_PATH_VALUE%"
            echo "Listing contents of C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA ..."
            dir "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA"
            exit /b 1
          )
          "%CUDA_PATH_VALUE%\bin\nvcc.exe" --version
          if %ERRORLEVEL% NEQ 0 (
            echo "nvcc verification failed using full path. Exit code: %ERRORLEVEL%"
            exit /b 1
          )
          echo "CUDA Toolkit installed successfully via Network Installer."

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ninja wheel diffusers transformers accelerate sentencepiece protobuf huggingface_hub peft opencv-python gradio GPUtil

      - name: Install PyTorch (CUDA ${{ env.CUDA_VERSION_MAJOR_MINOR }})
        run: |
          pip install torch==${{ env.TORCH_VERSION }}+${{ env.TORCH_CUDA_SUFFIX }} torchvision==${{ env.TORCHVISION_VERSION }}+${{ env.TORCH_CUDA_SUFFIX }} torchaudio==${{ env.TORCHAUDIO_VERSION }}+${{ env.TORCH_CUDA_SUFFIX }} --extra-index-url https://download.pytorch.org/whl/${{ env.TORCH_CUDA_SUFFIX }}
          python -c "import torch; print(f'PyTorch version: {torch.__version__}'); print(f'CUDA available: {torch.cuda.is_available()}'); print(torch.cuda.is_available())"


      - name: Build Nunchaku in Develop Mode
        shell: cmd
        run: |
          echo "Setting up MSVC environment and building Nunchaku..."
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvarsall.bat" x64
          
          echo "--- Environment Check ---"
          echo "PATH (first few entries):"
          echo %PATH:~0,500% 
          echo "..."
          echo "CUDA_PATH: %CUDA_PATH%"
          echo "CUDA_HOME: %CUDA_HOME%"
          echo "-------------------------"
          echo "Looking for nvcc:"
          where nvcc
          if %ERRORLEVEL% NEQ 0 (
             echo "nvcc still not found in PATH for build step!"
             exit /b 1
          )
          echo "Looking for cl.exe:"
          where cl
          if %ERRORLEVEL% NEQ 0 (
             echo "cl.exe not found in PATH for build step (MSVC issue)!"
             exit /b 1
          )
          echo "-------------------------"
          
          python setup.py develop

      - name: Build Wheel for Distribution
        shell: cmd
        run: |
          echo "Setting up MSVC environment and building wheel..."
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvarsall.bat" x64
          python -m build --wheel --no-isolation

      - name: Upload Wheel as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nunchaku-wheel-cuda${{ env.CUDA_VERSION_MAJOR_MINOR }}-py${{ env.PYTHON_VERSION }}
          path: dist/*.whl
